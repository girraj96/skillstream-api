services:
  mysql:
    image: mysql:8.4
    container_name: skillstream_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skillstream
      MYSQL_USER: skillstream
      MYSQL_PASSWORD: skillstream
    volumes:
      - skillstream_mysql_data:/var/lib/mysql

volumes:
  skillstream_mysql_data:
